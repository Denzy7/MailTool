name: test, build and release MailTool for windows and linux
on:
  push:
    branches:
      - main
      - ci
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  SUMATRA_VERSION: "3.5.2"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: "x86_64_linux"
            experimental: false
          # Windows has not been verified yet (see CLAUDE_CODE_PROMPT.md): report, don't block
          - os: windows-2022
            name: "x86_64_windows"
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: fix crlf
        run: git config --global core.autocrlf input

      - name: checkout
        uses: actions/checkout@v4

      - name: linux tools used by the tests
        if: matrix.name == 'x86_64_linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install python3-tk poppler-utils ghostscript

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: lint
        run: python -m pyflakes mailtool tests

      - name: pytest
        run: python -m pytest -q

      - name: dependency report
        if: always()
        run: python run_mailtool.py --check || true

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2022
            name: "x86_64_windows"
            pyi_name: "win64"
          - os: ubuntu-24.04
            name: "x86_64_linux"
            pyi_name: "linux64"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: fix crlf
        run: git config --global core.autocrlf input

      - name: checkout
        uses: actions/checkout@v4

      - name: linux setup and dependencies
        if: matrix.name == 'x86_64_linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install python3-tk

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: ${{ matrix.name }} venv
        run: |
          python -m venv .venv
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -m pip install --upgrade pip
          $PY -m pip install -r requirements-dev.txt

      - name: bundle SumatraPDF
        if: matrix.name == 'x86_64_windows'
        run: |
          curl -fsSL -o sumatra.zip "https://www.sumatrapdfreader.org/dl/rel/${SUMATRA_VERSION}/SumatraPDF-${SUMATRA_VERSION}-64.zip"
          7z e -y sumatra.zip "SumatraPDF-${SUMATRA_VERSION}-64.exe"
          mv "SumatraPDF-${SUMATRA_VERSION}-64.exe" SumatraPDF.exe

      - name: stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = .*/__version__ = \"${VER}\"/" mailtool/__init__.py
          grep __version__ mailtool/__init__.py

      - name: build
        run: |
          $PY -m PyInstaller --noconfirm MailTool.spec
          VER=$($PY -c 'from mailtool import __version__; print(__version__)')
          if [ "${{ matrix.name }}" = "x86_64_windows" ]; then
            OUT="MailTool-${VER}-${{ matrix.pyi_name }}.exe"; mv dist/MailTool.exe "$OUT"
          else
            OUT="MailTool-${VER}-${{ matrix.pyi_name }}"; mv dist/MailTool "$OUT"; chmod +x "$OUT"
          fi
          ls -l "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: smoke test the build
        run: |
          "./$OUT" --version || true
          "./$OUT" --check || true

      - name: ${{ matrix.name }} upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.OUT }}
          archive: false
          if-no-files-found: error

      - name: attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUT }}
